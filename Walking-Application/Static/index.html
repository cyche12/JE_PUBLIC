<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Walking App Analyzer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Walking Route Distance Analyzer</h1>
    <p>Select a property, toggle between views, then click Analyze.</p>
  </header>

  <main>
    <!-- controls: address, toggle, analyze -->
    <div id="controls">
      <label for="addressSelect">Choose a property:</label>
      <select id="addressSelect">
        <option value="">-- Select address --</option>
        <option>11 Royal Hunt Ct</option>
        <option>19 Royal Hunt Ct</option>
        <option>23 Lillico Dr</option>
        <option>33 Erin Crescent</option>
        <option>37 Erin Crescent</option>
        <option>41 Lillico Dr</option>
        <option>49 Erin Crescent</option>
        <option>65 Lillico Dr</option>
        <option>69 Lillico Dr</option>
        <option>73 Lillico Dr</option>
        <option>96 Erin Crescent</option>
        <option>104 Erin Crescent</option>
        <option>106 Erin Crescent</option>
        <option>115 Erin Crescent</option>
        <option>121 Erin Crescent</option>
      </select>
      <button id="toggleViewBtn" disabled>Show Satellite View</button>
      <button id="analyzeBtn" disabled>Analyze Optimal Route</button>
    </div>

    <!-- image preview + overlay canvas -->
    <div id="previewSection" style="position:relative; width:80vw; max-width:800px; margin:0 auto;">
      <img
        id="preview"
        src="train/images/Algonquin-College.png"
        alt="View Preview"
        style="width:100%; height:auto; display:block; margin:0 auto;"
      />
      <canvas
        id="overlay"
        style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"
      ></canvas>
    </div>

    <!-- loader + result -->
    <div id="loader" class="loader">Analyzing…</div>
    <div id="distanceDisplay" class="result"></div>
  </main>

  <script src="JS/UIHandler.js"></script>
  <script src="JS/OverlayHandler.js"></script>
  <script src="JS/Main.js"></script>
</body>
</html>
